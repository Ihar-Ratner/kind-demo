groups:
  - name: windows_node_rules
    rules:
      # Rule to create a new metric for CPU usage percentage
      - record: instance:windows_cpu_usage_percentage
        expr: 100 - (avg by (instance) (irate(windows_cpu_time_total{mode="idle"}[5m])) * 100)
        labels:
          job: windows-node

      # Rule to create a new metric for memory usage percentage
      - record: instance:windows_memory_usage_percentage
        expr: 100 - (windows_memory_physical_free_bytes / windows_memory_physical_total_bytes * 100)
        labels:
          job: windows-node
